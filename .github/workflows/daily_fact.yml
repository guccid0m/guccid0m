name: Daily Random Fact

on:
  schedule:
    - cron: '0 8 * * *' # Runs automatically every day at 8:00 AM UTC (1:00 AM Pacific)
  workflow_dispatch:    # Lets you trigger it manually with a button anytime

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python fact script
        run: python3 update_fact.py

      - name: Commit and push updated fact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update daily random fact"
          git push
